    <section class="col">
      <div class="panel">
        <h2>Run Agent</h2>
        <div style="display:flex;flex-direction:column;gap:16px">
          <textarea id="topic" rows="3" placeholder="What do you want to know? e.g. skeptical about wireless headphones — what&#39;s best this year? compare Bose &amp; Sony"></textarea>
          <div class="row" style="flex-wrap:wrap">
            <label class="toggle"><input type="checkbox" id="src-reddit"> Reddit</label>
            <label class="toggle"><input type="checkbox" id="src-hn"> HN</label>
            <label class="toggle"><input type="checkbox" id="src-facebook" checked> Facebook</label>
            <label class="toggle"><input type="checkbox" id="src-x"> X</label>
            <label class="toggle"><input type="checkbox" id="src-instagram"> Instagram</label>
            <label class="toggle"><input type="checkbox" id="src-youtube"> YouTube</label>
            <label class="toggle"><input type="checkbox" id="src-polymarket"> Polymarket</label>
            <label class="toggle"><input type="checkbox" id="src-github"> GitHub</label>
            <label class="toggle"><input type="checkbox" id="src-bluesky"> Bluesky</label>
          </div>
          <button id="go" class="cta-primary">Start agent</button>
        </div>

      </div>

      <div class="panel">
        <h2>Metrics</h2>
        <div class="grid3">
          <div class="kpi"><span>Posts</span><b id="m-posts">0</b></div>
          <div class="kpi"><span>Topics</span><b id="m-clusters">0</b></div>
          <div class="kpi"><span title="How spread out the conversation is across different talking points.">Topic spread</span><b id="m-entropy">--</b></div>
        </div>

        <div id="replay-wrap" style="display:none;margin-top:24px">
          <h2 style="margin-bottom:12px">Replay Timeline</h2>
          <input id="replay-slider" type="range" min="1" max="1" value="1" step="1"
                 style="width:100%;margin:0;padding:0; accent-color: var(--accent2);" />
          <div class="muted" id="replay-caption" style="margin-top:8px">iteration 1 of 1</div>
        </div>
      </div>

    </section>
